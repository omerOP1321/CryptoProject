<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password · Crypto AI Prediction</title>
    <link rel="stylesheet" href="styles.css?v=17">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js?v=13"></script>
    <script src="auth.js?v=19"></script>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="page">
        <header>
            <div class="brand">
                <div class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="17.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">₿</text></svg>
                </div>
                <div class="title">Crypto AI Prediction</div>
            </div>
            <a href="index.html" class="back-link" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</a>
        </header>

        <div class="auth-status-card">
            <h2>Choose a new password</h2>
            <form class="auth-form" id="reset-form" novalidate style="max-width:360px;margin:14px auto 0">
                <div class="auth-field"><label>New password</label>
                    <input name="password" type="password" autocomplete="new-password" maxlength="128"></div>
                <div class="auth-field"><label>Confirm password</label>
                    <input name="confirm" type="password" autocomplete="new-password" maxlength="128"></div>
                <p class="auth-hint">8+ characters, with at least one letter and one number.</p>
                <div class="auth-error" id="reset-err" role="alert"></div>
                <div class="auth-ok" id="reset-ok" role="status"></div>
                <button class="auth-submit" type="submit">Reset password</button>
            </form>
        </div>

        <div class="credits">created by: Ofir Zohar, Omer Peretz, Ofir Fichman, Molly</div>
    </div>

    <script src="verify-reset.js?v=13" data-flow="reset"></script>
</body>
</html>
